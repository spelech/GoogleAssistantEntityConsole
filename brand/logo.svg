<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top row gradient: Blue (#4285F4) to Red (#EA4335) -->
    <linearGradient id="topRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>

    <!-- Bottom row gradient: Yellow (#FBBC05) to Green (#34A853) -->
    <linearGradient id="bottomRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>

    <!-- Vertical alpha blend for bilinear 4-corner gradient -->
    <linearGradient id="verticalBlend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <mask id="verticalMask">
      <rect x="0" y="0" width="512" height="512" fill="url(#verticalBlend)"/>
    </mask>

    <!-- Exact Home Assistant House Shape as Mask -->
    <mask id="haHouseMask">
      <g transform="translate(25.6, 25.6) scale(3.84)">
        <g transform="matrix(.938408 0 0 .93841 -5.688557 -13.572944)">
          <path fill="#ffffff" d="M73.5367 13.0937 106.463 46.0524v.0033C108.41 48.0043 110 51.848 110 54.6007v30.0292c0 2.7527-2.25 5.0049-5 5.0049l-70-.0034c-2.75 0-5-2.2522-5-5.0048V54.5974c0-2.7527 1.5933-6.5998 3.5367-8.545l32.93-32.9587c1.9433-1.9452 5.1266-1.9452 7.07 0Z" transform="matrix(1.598452 0 0 1.598452 -41.89164 -.937304)"/>
        </g>
      </g>
    </mask>
  </defs>

  <!-- 4-Corner Gradient Fill clipped to Home Assistant House -->
  <g mask="url(#haHouseMask)">
    <!-- Top Gradient (Blue -> Red) -->
    <rect x="0" y="0" width="512" height="512" fill="url(#topRow)"/>
    <!-- Bottom Gradient (Yellow -> Green) blended over top -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bottomRow)" mask="url(#verticalMask)"/>
  </g>

  <!-- Home Assistant White Network Lines and Nodes -->
  <g transform="translate(25.6, 25.6) scale(3.84)">
    <g transform="matrix(.938408 0 0 .93841 -5.688557 -13.572944)">
      <g transform="matrix(1.598452 0 0 1.598452 -41.89164 -.937311)">
        <path d="m70 89.6348-20-20M70 89.6348v-52M90 58.1348l-20 20" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.5"/>
        <circle r="7.5" fill="#ffffff" transform="translate(50 69.634804)"/>
        <circle r="7.5" fill="#ffffff" transform="translate(90 58.634798)"/>
        <circle r="7.5" fill="#ffffff" transform="translate(70 37.6348)"/>
      </g>
    </g>
  </g>
</svg>