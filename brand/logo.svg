<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roofBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradient)" stroke="#334155" stroke-width="4"/>

  <!-- Network Connecting Lines -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- House Outer Outline (Subtle Glow) -->
    <path d="M 130 230 L 256 120 L 350 196 L 350 120 L 380 120 L 380 220 L 382 230 L 360 230 L 360 395 L 152 395 L 152 230 Z"
          fill="none" stroke="#475569" stroke-width="16" stroke-opacity="0.6"/>

    <!-- Internal Network Edges -->
    <!-- Blue branch from Peak -->
    <line x1="256" y1="120" x2="180" y2="230" stroke="#4285F4" stroke-width="12" stroke-opacity="0.9"/>
    <line x1="256" y1="120" x2="256" y2="260" stroke="#4285F4" stroke-width="12" stroke-opacity="0.9"/>
    
    <!-- Red branch to Chimney -->
    <line x1="256" y1="120" x2="350" y2="196" stroke="#EA4335" stroke-width="12" stroke-opacity="0.9"/>
    <line x1="350" y1="196" x2="350" y2="120" stroke="#EA4335" stroke-width="12" stroke-opacity="0.9"/>
    <line x1="256" y1="260" x2="332" y2="230" stroke="#EA4335" stroke-width="10" stroke-opacity="0.8"/>

    <!-- Yellow branch in Core -->
    <line x1="256" y1="260" x2="180" y2="325" stroke="#FBBC05" stroke-width="12" stroke-opacity="0.9"/>
    <line x1="256" y1="260" x2="332" y2="325" stroke="#FBBC05" stroke-width="12" stroke-opacity="0.9"/>
    <line x1="256" y1="260" x2="256" y2="395" stroke="#FBBC05" stroke-width="12" stroke-opacity="0.9"/>

    <!-- Green branch at Foundation -->
    <line x1="180" y1="325" x2="152" y2="395" stroke="#34A853" stroke-width="12" stroke-opacity="0.9"/>
    <line x1="332" y1="325" x2="360" y2="395" stroke="#34A853" stroke-width="12" stroke-opacity="0.9"/>
    <line x1="152" y1="395" x2="256" y2="395" stroke="#34A853" stroke-width="14" stroke-opacity="0.9"/>
    <line x1="256" y1="395" x2="360" y2="395" stroke="#34A853" stroke-width="14" stroke-opacity="0.9"/>
  </g>

  <!-- Network Nodes (The 4 Google Assistant Signature Circles + Junctions) -->
  <!-- Junction Secondary Dots -->
  <circle cx="180" cy="230" r="14" fill="#64748b"/>
  <circle cx="332" cy="230" r="14" fill="#64748b"/>
  <circle cx="180" cy="325" r="16" fill="#94a3b8"/>
  <circle cx="332" cy="325" r="16" fill="#94a3b8"/>
  <circle cx="152" cy="395" r="16" fill="#34A853"/>
  <circle cx="360" cy="395" r="16" fill="#34A853"/>

  <!-- 1. Google Blue Dot (Roof Apex) -->
  <circle cx="256" cy="120" r="26" fill="#4285F4" filter="url(#glow)"/>
  <circle cx="256" cy="120" r="14" fill="#ffffff" fill-opacity="0.3"/>

  <!-- 2. Google Red Dot (Chimney Top) -->
  <circle cx="350" cy="120" r="22" fill="#EA4335" filter="url(#glow)"/>
  <circle cx="350" cy="120" r="11" fill="#ffffff" fill-opacity="0.3"/>

  <!-- 3. Google Yellow Dot (Living Center Hub) -->
  <circle cx="256" cy="260" r="28" fill="#FBBC05" filter="url(#glow)"/>
  <circle cx="256" cy="260" r="15" fill="#ffffff" fill-opacity="0.3"/>

  <!-- 4. Google Green Dot (Ground / Base Center) -->
  <circle cx="256" cy="395" r="26" fill="#34A853" filter="url(#glow)"/>
  <circle cx="256" cy="395" r="14" fill="#ffffff" fill-opacity="0.3"/>
</svg>